name: EAS OTA Update (Preview)

on:
  push:
    branches:
      - backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-ota-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Validate app/web and publish OTA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that this commit is OTA-safe
        id: safety
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$BEFORE_SHA"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" "$CURRENT_SHA" > changed-files.txt
            echo "Files in this change:"
            cat changed-files.txt

            if grep -Eq '^(app\.json|app\.config\.(js|ts|json)|eas\.json|package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|google-services\.json|babel\.config\.js|metro\.config\.js|android/|ios/|plugins/)(/|$)' changed-files.txt; then
              echo "skip_ota=true" >> "$GITHUB_OUTPUT"
              {
                echo "### OTA skipped — new app build required"
                echo "This commit changes native configuration, native code, or dependencies. Build and install a new app version before delivering these changes."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Native/configuration changes detected; skipping OTA publication."
              exit 0
            fi
          fi

          echo "skip_ota=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.safety.outputs.skip_ota != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.safety.outputs.skip_ota != 'true'
        run: npm ci

      - name: Validate Android app bundle
        if: steps.safety.outputs.skip_ota != 'true'
        run: npx expo export --platform android --output-dir /tmp/zajel-android-export

      - name: Validate web bundle
        if: steps.safety.outputs.skip_ota != 'true'
        run: npx expo export --platform web --output-dir /tmp/zajel-web-export

      - name: Check Expo access token
        id: auth
        if: steps.safety.outputs.skip_ota != 'true'
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -n "${EXPO_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### App and web bundles validated; OTA not published"
              echo "The GitHub Actions secret EXPO_TOKEN is missing. Add it in Settings → Secrets and variables → Actions. No over-the-air update was sent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::EXPO_TOKEN is missing; bundle checks passed but OTA publication was skipped."
          fi

      - name: Publish OTA update to preview channel
        if: steps.safety.outputs.skip_ota != 'true' && steps.auth.outputs.available == 'true'
        run: npx eas-cli update --channel preview --message "GitHub OTA update $GITHUB_SHA" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
