name: EAS OTA Update (Preview)

on:
  push:
    branches:
      - backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-ota-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that this commit is OTA-safe
        id: safety
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE_SHA="$BEFORE_SHA"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" "$CURRENT_SHA" > changed-files.txt
            echo "Files in this change:"
            cat changed-files.txt

            if grep -Eq '^(app\.json|app\.config\.(js|ts|json)|eas\.json|package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|google-services\.json|babel\.config\.js|metro\.config\.js|android/|ios/|plugins/)(/|$)' changed-files.txt; then
              echo "skip_ota=true" >> "$GITHUB_OUTPUT"
              {
                echo "### OTA skipped"
                echo "This commit changes native configuration, native code, or dependencies. Publish a new app build before delivering these changes."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Native/configuration changes detected; skipping OTA publication."
              exit 0
            fi
          fi

          echo "skip_ota=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.safety.outputs.skip_ota != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.safety.outputs.skip_ota != 'true'
        run: npm ci

      - name: Publish to the preview channel
        if: steps.safety.outputs.skip_ota != 'true'
        run: npx eas-cli update --channel preview --message "GitHub OTA update $GITHUB_SHA" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
